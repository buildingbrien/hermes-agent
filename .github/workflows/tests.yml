name: Tests

# TWO PIPELINES live in this repo, and only one of them ships:
#
#   * build/runtime  — the SHIPPING runtime. Materialized by ./build-runtime.sh
#     from vendor/hermes-upstream (pristine upstream at UPSTREAM_TAG) + the
#     runtime-patches/ series + runtime-addons/. This is what release.yml
#     bundles into the desktop app and what customers run. Gated by the
#     `runtime-tests` / `runtime-tests-macos` jobs below.
#
#   * the repo ROOT (tools/, agent/, tests/ …) — the pre-rebase v0.10.0
#     content-fork. Phase B4 deleted that tree (it lived redundantly in
#     vendor/ + the overlay; the shipping runtime is build/runtime), so the
#     `test` / `e2e` jobs that ran against it have been retired along with it.
#
# Before 2026-09-13 only the root tree was tested here: runtime patches
# 0018–0021 and their addon tests were verified by hand on a soak box, never
# in CI. Test what we ship.

on:
  push:
    # prod-hardening/base is the branch the desktop app actually bundles at
    # build time.  It was absent here, so the branch that ships was the one
    # branch never tested — and on 2026-08-02 a delegation fix landed on main,
    # passed CI, and shipped in nothing.  Test what we ship.
    branches: [main, prod-hardening/base]
  pull_request:
    branches: [main, prod-hardening/base]
  workflow_dispatch:

permissions:
  contents: read

# Cancel in-progress runs for the same PR only — a quick follow-up push to the
# mainline must not leave the earlier mainline commit without a completed run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── Shipping runtime: build/runtime ────────────────────────────────────────
  #
  # Both runtime jobs install the runtime's dependencies the way the desktop
  # app provisions a customer machine (electron/provisioning/bridge-deps.ts
  # :: installRuntimeDeps in lucaryin-ai): read [project].dependencies out of
  # the MATERIALIZED pyproject.toml — so the 0017 cryptography re-pin and the
  # 0021 pyobjc addon deps are exercised — and `pip install --prefer-binary
  # -r` them with the runtime on PYTHONPATH. Never `pip install build/runtime`:
  # upstream's setup.py refuses wheel/sdist builds ("Building wheels or sdists
  # for hermes-agent is not supported") and the product never installs the
  # package either.
  #
  # On top of that product set, the Linux lane adds the extras upstream's own
  # CI installs (`all`, `dev`, and the lazy-install SDKs: anthropic,
  # fal, modal, daytona, hindsight, parallel-web). They are test-only:
  # tests/conftest.py sets HERMES_DISABLE_LAZY_INSTALLS=1, so an upstream test
  # that exercises e.g. the Anthropic aux client or the Daytona backend needs
  # the SDK present up front or it fails on ImportError rather than on
  # anything we changed. The macOS lane needs only `dev`.
  #
  # Tests run from inside build/runtime so upstream's tests/conftest.py and
  # [tool.pytest.ini_options] apply unchanged (hermetic HERMES_HOME, blanked
  # credential env vars, `-m 'not integration'`).
  runtime-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # A red slice never cancels its siblings: each slice's failures are
      # independent evidence, and cancelling would hide them.
      fail-fast: false
      matrix:
        slice: [1, 2, 3]
    # No job-level PYTHONPATH: every test step runs from build/runtime (rootdir
    # conftest resolves imports), exactly like upstream's CI. A job-level
    # PYTHONPATH leaked into tests/tools/test_local_env_blocklist, which asserts
    # about PYTHONPATH stripping (7 false failures on the first run).
    env:
      SLICES: "3"
      # Same deterministic-runtime knobs as upstream's scripts/run_tests.sh.
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      # Ensure tests don't accidentally call real APIs
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        # ripgrep: the search tests exercise the rg lane as well as the
        # no-rg fallback lane (patch 0020).
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Materialize the runtime (vendor + patch series + addons)
        # --check fails the job if any runtime-patches/series entry no longer
        # applies to the vendored upstream. Runs BEFORE setup-python so the pip
        # cache can key on the materialized (patched) pyproject.toml.
        run: ./build-runtime.sh --check

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/runtime/pyproject.toml

      # The runtime always runs INSIDE a venv on real machines (~/.lucaryin/venvs/
      # hermes) and in upstream's uv-managed CI. tools/environments/local.py gates
      # its venv-site-packages stripping on sys.base_prefix != sys.prefix, so the
      # bare hosted-toolcache interpreter failed 7 tests in test_local_env_blocklist
      # on the first runs. Same interpreter, same pip cache — just a venv.
      - name: Create the venv the tests run in
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; assert sys.prefix != sys.base_prefix; print("venv:", sys.prefix)'
      - name: Install runtime dependencies (product set + upstream's test extras)
        run: |
          python - build/runtime/pyproject.toml \
              dev all anthropic fal modal daytona hindsight parallel-web \
              > "$RUNNER_TEMP/runtime-deps.txt" <<'EOF'
          import sys, tomllib
          project = tomllib.load(open(sys.argv[1], "rb"))["project"]
          extras = project.get("optional-dependencies", {})
          out, seen = list(project["dependencies"]), set()
          def add(extra):
              if extra in seen:
                  return
              seen.add(extra)
              for req in extras.get(extra, []):
                  if req.startswith("hermes-agent["):   # self-referencing extra, e.g. hermes-agent[cron]
                      add(req[len("hermes-agent["):-1])
                  else:
                      out.append(req)
          for extra in sys.argv[2:]:
              add(extra)
          print("\n".join(dict.fromkeys(out)))
          EOF
          echo "::group::resolved requirement set"
          cat "$RUNNER_TEMP/runtime-deps.txt"
          echo "::endgroup::"
          # The venv ships pip 25.0; the runs that resolved this set used 26.x. Same resolver everywhere.
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r "$RUNNER_TEMP/runtime-deps.txt"

      - name: Addon import smoke (every runtime-addons module loads on Linux)
        working-directory: build/runtime
        run: |
          python - <<'EOF'
          import importlib, pathlib, sys
          addons = pathlib.Path("../../runtime-addons")
          mods = sorted(
              ".".join(p.relative_to(addons).with_suffix("").parts)
              for p in addons.rglob("*.py")
              if "tests" not in p.relative_to(addons).parts and p.name != "__init__.py"
          )
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"ok    {m}")
              except Exception as exc:  # noqa: BLE001 — report every addon, then fail once
                  failed.append(m)
                  print(f"FAIL  {m}: {type(exc).__name__}: {exc}")
          if not mods:
              sys.exit("no addon modules found under runtime-addons/")
          if failed:
              sys.exit(f"{len(failed)} addon module(s) failed to import: {', '.join(failed)}")
          EOF

      - name: Addon tests (fork-owned, runtime-addons/tests)
        # The tests that cover our own patches (0019/0020 …). Listed from
        # runtime-addons/tests so a new addon test file is picked up without
        # editing this workflow; they land at the same relative path inside
        # build/runtime. Fails if the list is empty — a green job that ran
        # nothing is the failure mode this job exists to prevent. Cheap
        # (~10 s), so every slice runs it and is self-contained.
        working-directory: build/runtime
        run: |
          ADDON_TESTS="$(cd ../../runtime-addons && find tests -name 'test_*.py' | sort)"
          if [ -z "$ADDON_TESTS" ]; then
            echo "::error::no addon tests found under runtime-addons/tests"
            exit 1
          fi
          # shellcheck disable=SC2086 — repo-relative paths, no spaces
          python -m pytest $ADDON_TESTS -q -p no:cacheprovider

      - name: Upstream suite for the patched surface (tests/tools + tests/agent + tests/cron, slice ${{ matrix.slice }}/3)
        # Every fold patch lands in tools/, agent/, run_agent.py, toolsets.py,
        # cron/ or hermes_cli/ — tests/tools + tests/agent (1102 files,
        # ~15.2k tests) are the upstream tests for the files we actually
        # rewrite; tests/cron (103 files, ~1.3k tests, ~100 s on 8 workers)
        # joined on 2026-09-14 with patch 0023, which rewrites the cron
        # delivery path (0007 already folded cron/ untested here).
        # Measured 2026-09-13 on an 8-core M-series, 8 workers:
        # 19 min wall, 8.7k subprocess-seconds (tools 5.9k, agent 2.8k). A
        # 4-core ubuntu-latest is slower per core, so the suite is split into
        # 3 count-balanced slices (≈15–20 min each). The FULL upstream suite
        # (~3900 files) needs upstream's 96-core runner to finish in ~2 min
        # and is not a PR gate here.
        #
        # Uses upstream's canonical per-file runner (one fresh `python -m
        # pytest <file>` per file, bounded parallelism, one retry per failing
        # file reported loudly as FLAKY, exit-5 "nothing collected" tolerated
        # per file) instead of a single pytest process, because upstream's
        # suite relies on that per-file isolation. -j = one worker per core:
        # upstream measured 1x cores as the fastest point, and fewer
        # over-subscribed workers means fewer timing-sensitive flakes.
        #
        # runtime-patches/upstream-test-deselect.txt lists the upstream tests
        # that assert behaviour a fold patch intentionally changes (one node
        # id per line, each justified by its patch). Anything else that fails
        # is a regression.
        working-directory: build/runtime
        run: |
          DESELECT=()
          while IFS= read -r line; do
            line="${line%%#*}"; line="${line//[[:space:]]/}"
            [ -n "$line" ] && DESELECT+=("--deselect=$line")
          done < ../../runtime-patches/upstream-test-deselect.txt
          echo "deselecting ${#DESELECT[@]} upstream test(s) (see runtime-patches/upstream-test-deselect.txt)"
          python scripts/run_tests_parallel.py tests/tools tests/agent tests/cron \
            --slice "${{ matrix.slice }}/$SLICES" -j "$(nproc)" \
            -q -p no:cacheprovider "${DESELECT[@]}"

  runtime-tests-macos:
    # Several folds are darwin-only (0019 leading-space extracted-doc names,
    # 0020 BSD `find -flags +dataless` / iCloud placeholder lane, 0021 pyobjc
    # desktop deps). Their tests carry DARWIN_ONLY skips on Linux, so this
    # lane is the only place they execute. It also proves the darwin
    # dependency set (pyobjc, nemo-relay arm64, cryptography) resolves with
    # `--prefer-binary` on a clean Mac, which is what first-launch
    # provisioning does. Independent of `runtime-tests` (no `needs`): a red
    # lane on one OS never cancels the other.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONHASHSEED: "0"
      PYTHONUTF8: "1"
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
      NOUS_API_KEY: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Materialize the runtime (vendor + patch series + addons)
        run: ./build-runtime.sh --check

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: build/runtime/pyproject.toml

      # The runtime always runs INSIDE a venv on real machines (~/.lucaryin/venvs/
      # hermes) and in upstream's uv-managed CI. tools/environments/local.py gates
      # its venv-site-packages stripping on sys.base_prefix != sys.prefix, so the
      # bare hosted-toolcache interpreter failed 7 tests in test_local_env_blocklist
      # on the first runs. Same interpreter, same pip cache — just a venv.
      - name: Create the venv the tests run in
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/venv/bin/python" -c 'import sys; assert sys.prefix != sys.base_prefix; print("venv:", sys.prefix)'
      - name: Install runtime dependencies (product set + dev)
        # Same extractor as the Linux lane (keep the two in lockstep); only
        # the `dev` extra here — the darwin-lane files need nothing else.
        run: |
          python - build/runtime/pyproject.toml dev > "$RUNNER_TEMP/runtime-deps.txt" <<'EOF'
          import sys, tomllib
          project = tomllib.load(open(sys.argv[1], "rb"))["project"]
          extras = project.get("optional-dependencies", {})
          out, seen = list(project["dependencies"]), set()
          def add(extra):
              if extra in seen:
                  return
              seen.add(extra)
              for req in extras.get(extra, []):
                  if req.startswith("hermes-agent["):   # self-referencing extra, e.g. hermes-agent[cron]
                      add(req[len("hermes-agent["):-1])
                  else:
                      out.append(req)
          for extra in sys.argv[2:]:
              add(extra)
          print("\n".join(dict.fromkeys(out)))
          EOF
          echo "::group::resolved requirement set"
          cat "$RUNNER_TEMP/runtime-deps.txt"
          echo "::endgroup::"
          # The venv ships pip 25.0; the runs that resolved this set used 26.x. Same resolver everywhere.
          python -m pip install --upgrade pip
          python -m pip install --prefer-binary -r "$RUNNER_TEMP/runtime-deps.txt"

      - name: Darwin-lane tests
        # The addon tests (their DARWIN_ONLY cases run for real here) plus
        # upstream's macOS protected-folder search test, which patch 0020
        # rewrites around. test_desktop_use_addon.py's darwin-only cases
        # (libquarantine responsible pid, libproc proc_pidpath, dyld image
        # path, NSFileManager display name) execute ONLY here — the Linux
        # addon job skips them. `-p no:cacheprovider` keeps .pytest_cache
        # out of the materialized tree.
        working-directory: build/runtime
        run: |
          python -m pytest \
            tests/tools/test_search_fallback_bounds.py \
            tests/tools/test_read_extract_not_found_rescue.py \
            tests/tools/test_macos_protected_search.py \
            tests/tools/test_desktop_use_addon.py \
            -q -p no:cacheprovider

  # ── Pre-rebase root tree (does NOT ship) ───────────────────────────────────
  #
  # The `test` and `e2e` jobs that lived here tested the OLD flat runtime at
  # the repo root (the pre-rebase v0.10.0 tree: tools/, agent/, gateway/,
  # tests/ …). Phase B4 deleted that tree — it duplicated what now lives in
  # vendor/ + the overlay, and the app bundles build/runtime, not the root —
  # so both jobs were retired with it (they could only fail once their tree
  # was gone; `e2e`'s import closure gateway → hermes_cli → agent/tools spanned
  # the whole fork runtime). The shipping runtime is gated by the
  # `runtime-tests` / `runtime-tests-macos` jobs above; the upstream test tree
  # that used to back these jobs now lives at build/runtime/tests and is
  # exercised there. Rollback: revert the B4 commit to restore the tree and
  # these jobs.
